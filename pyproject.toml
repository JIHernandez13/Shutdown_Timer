[project]
name = "shutdown-timer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "gitlint>=0.19.1",
    "pre-commit>=4.6.2",
    "pytest>=8.3",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# gitlint-core needs `sh` only off-Windows (sys_platform != 'win32'), but its
# sdist can't build on Windows (setup.py imports fcntl). Supplying the metadata
# here lets uv resolve the universal lock from Windows without building it.
[[tool.uv.dependency-metadata]]
name = "sh"
version = "1.14.3"
requires-dist = []

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade,
# B flake8-bugbear, SIM flake8-simplify, RUF ruff-specific
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
