name: Gitlint

on:
  pull_request:

jobs:
  gitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dev dependencies
        run: uv sync --only-dev

      - name: Lint commit messages
        run: uv run gitlint --commits "origin/${{ github.base_ref }}..HEAD"
